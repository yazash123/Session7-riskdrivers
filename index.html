/* Layout: a facilitation "bar slide" turned into a page. A header bar of butting tiles (lowercase serif title, room, mustard duration chip), then a forest field while members work alone and a chambray field once the room talks together. Content sits in cream panels with a coloured spine, or in edge-to-edge colour tiles. On the board, the ten drivers are bricks laid as a two-course wall along the bottom; the room's risks sit above as spine panels; members draw lines up from the wall.
   House of the People slide system: 0 radius, no shadows, no gutters between tiles, one dark + one medium + one light per view, white text on dark, black on medium and light, Adelphe for titles and questions, Poppins for labels and body. */
:root{
  --crimson:#C0184F; --forest:#387030; --chambray:#5878A0;
  --pink:#E078B0; --purple:#B868C0; --coral:#E06050; --orange:#E08850;
  --sky:#C0E8F8; --banana:#F0E060; --mustard:#E0C060;
  --black:#0A0A0A; --white:#FFFFFF; --cream:#FDFCF3; --grey:#6B6B6B; --rule:rgba(10,10,10,.16);
  --field:var(--forest);
  --ff-serif:"Adelphe","GT Sectra",Georgia,serif;
  --ff-sans:"BBB Poppins TN","Poppins",system-ui,-apple-system,sans-serif;
  --max:1440px; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
body{background:var(--field);color:var(--black);font-family:var(--ff-sans);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .36s var(--ease)}
body.ph-together{--field:var(--chambray)}
body.st-drivers{--field:var(--sky)}
body.st-drivers .keys{color:var(--black)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--field)}
*{box-sizing:border-box;border-radius:0}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active:not(:disabled){transform:translateY(2px)}
:focus-visible{outline:3px solid var(--chambray);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:700;font-size:13px;line-height:1.15;letter-spacing:.12em;text-transform:uppercase}
.dots{display:inline-flex;gap:.32em;align-items:center}
.dots i{display:block;width:.62em;height:.62em;border-radius:999px;background:var(--dot,currentColor)}

/* ---------- header bar: butting tiles ---------- */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;padding-top:clamp(12px,1.6vw,22px)}
.bar>div{min-width:0;display:flex;flex-direction:column;justify-content:center}
.bar-title{background:var(--banana);padding:14px clamp(16px,2.4vw,34px);gap:4px}
.bar-title .eyebrow{font-size:12px}
.bar-title h1{font-family:var(--ff-serif);font-weight:600;font-size:clamp(30px,1rem + 2vw,52px);line-height:1;letter-spacing:-.01em;text-transform:lowercase}
.bar-title h1 b{font-weight:600}
.bar-title .rk{font-size:15px;line-height:1.3;max-width:70ch}
.bar-title .rk b{font-weight:700}
.bar-room{background:var(--sky);padding:12px 18px;flex-direction:row!important;align-items:center;gap:10px}
.bar-room label{font-weight:700;font-size:15px}
.bar-room select{border:2px solid var(--black);background:var(--white);padding:7px 10px;font-weight:700;font-size:16px}
.bar-dur{background:var(--mustard);padding:10px 18px;gap:6px;min-width:170px}
.bar-dur .lbl{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.bar-dur .clk{font-weight:700;font-size:clamp(28px,1rem + 1.2vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.bar-dur .clk small{font-size:.5em;margin-left:.15em}
.bar-dur .clk.done{font-size:22px}
.bar-dur .row{display:flex;gap:6px}
.bar-dur button{border:0;background:var(--black);color:var(--white);font-weight:700;font-size:13px;padding:6px 10px}
.bar-dur button.ghost{background:transparent;color:var(--black);text-decoration:underline;padding:6px 4px}
@media(max-width:820px){.bar{grid-template-columns:1fr 1fr}.bar-title{grid-column:1/-1}}

/* ---------- step strip ---------- */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--field);transition:background-color .36s var(--ease)}
.steps ol{display:flex;flex-wrap:wrap;background:var(--black)}
.steps button{border:0;background:none;color:var(--white);font-weight:700;font-size:15px;white-space:nowrap;padding:12px clamp(10px,1.2vw,18px);display:flex;align-items:center;gap:9px}
.steps button:hover{background:rgba(255,255,255,.14)}
.steps button[aria-current="step"]{background:var(--banana);color:var(--black)}
.steps .sq{width:11px;height:11px;background:var(--forest);outline:1.5px solid rgba(255,255,255,.7)}
.steps .sq.tg{background:var(--chambray)}
.steps [aria-current="step"] .sq{outline-color:var(--black)}
.steps .gap{flex:1}
.steps .n{font-weight:700;font-size:12px;background:var(--white);color:var(--black);padding:0 7px;border-radius:999px}

.demo{background:var(--orange);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;font-size:15px}
.demo button{border:0;background:var(--black);color:var(--white);font-weight:700;padding:8px 14px}

main{padding-block:clamp(14px,2vw,28px) 0}
.pbody{display:flex;flex-direction:column;gap:clamp(14px,1.8vw,24px);min-width:0;padding-bottom:clamp(18px,2.4vw,32px)}

/* ---------- spine panel: the workhorse ---------- */
.sp{display:grid;grid-template-columns:22px minmax(0,1fr);background:var(--cream);min-width:0}
.sp>.spine{background:var(--spine,var(--crimson))}
.sp>.body{padding:clamp(18px,2.6vw,40px) clamp(18px,3vw,48px);display:flex;flex-direction:column;gap:14px;min-width:0}
.sp .eyebrow{color:var(--eyecol,var(--crimson))}
.sp .q{font-family:var(--ff-serif);font-weight:600;font-size:clamp(26px,1rem + 1.6vw,44px);line-height:1.1;letter-spacing:-.005em;max-width:30ch;text-wrap:balance}
.sp .q.sm{font-size:clamp(22px,1rem + .9vw,32px)}
.sp .note{font-size:16px;color:var(--black);max-width:70ch}
.sp .note b{font-weight:700}

/* ---------- tiles: butting colour blocks ---------- */
.tiles{display:grid;gap:0}
.tile{min-width:0;padding:clamp(16px,1.8vw,26px);display:flex;flex-direction:column;gap:10px;background:var(--bg);color:var(--fg,var(--black))}
.tile .lab{font-weight:700;font-size:clamp(17px,.9rem + .5vw,22px);line-height:1.12;text-transform:uppercase;letter-spacing:.01em}
.tile .sub{font-size:15px;line-height:1.35}
.tile .dots{font-size:clamp(18px,1.6vw,24px)}

/* set up */
.clusters{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:860px){.clusters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.clusters{grid-template-columns:1fr}}
.clusters button.tile{border:0;text-align:left;cursor:pointer;min-height:150px;justify-content:flex-start;position:relative}
.clusters button.tile:hover{filter:brightness(.93)}
.clusters button.tile[aria-pressed="true"]{background:var(--banana);color:var(--black)}
.clusters button.tile[aria-pressed="true"]::after{content:"Your room";position:absolute;top:0;right:0;background:var(--black);color:var(--white);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px}
.clusters li{font-size:15px;line-height:1.3;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.clusters li::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor;transform:translateY(-1px)}
.phases{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.phases .tile .big{font-family:var(--ff-serif);font-weight:600;font-size:clamp(24px,1rem + 1vw,34px);line-height:1.05;text-transform:lowercase}
@media(max-width:620px){.phases{grid-template-columns:1fr}}

/* the drivers, as a tiled slide */
.dtiles{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.dtiles{grid-template-columns:1fr}}
.dtiles .tile{min-height:170px}
.dtiles .ttl{background:var(--sky);color:var(--black);justify-content:flex-end}
.dtiles .ttl .eyebrow{color:var(--crimson)}
.dtiles .ttl h2{font-family:var(--ff-serif);font-weight:600;font-size:clamp(28px,1rem + 1.4vw,42px);line-height:1;text-transform:lowercase}
.dtiles .num{font-weight:700;font-size:13px;letter-spacing:.12em}
.dtiles .own{background:var(--black);color:var(--white);outline:2px dashed var(--white);outline-offset:-10px}

/* ---------- the board ---------- */
.drawhead .body{padding-block:clamp(14px,1.6vw,22px)}
.drawgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;align-items:stretch}
@media(max-width:1100px){.drawgrid{grid-template-columns:minmax(0,1fr)}}
.boardwrap{overflow-x:auto;min-width:0;background:var(--sky)}
.board{position:relative;width:100%;min-width:640px;aspect-ratio:1000/560;container-type:inline-size;user-select:none;-webkit-user-select:none;background:var(--sky)}
.board svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;pointer-events:none}
.board svg.lines .hit{pointer-events:stroke}
.board .sun{position:absolute;width:15%;aspect-ratio:1;border-radius:999px;background:var(--banana);right:4%;top:-6%;max-width:100%}
.board .ground{position:absolute;left:0;right:0;bottom:0;height:23.2%;background:var(--black)}
.board .walllab{position:absolute;left:50%;transform:translateX(-50%);bottom:26.2%;white-space:nowrap;font-weight:700;font-size:max(10px,1.05cqw);letter-spacing:.12em;text-transform:uppercase;z-index:1}
.it{position:absolute;touch-action:none;cursor:crosshair;min-width:0;z-index:3}
.it .grip{position:absolute;top:0;right:0;width:max(20px,2.4cqw);height:max(20px,2.4cqw);display:grid;place-items:center;cursor:grab;touch-action:none;font-size:max(12px,1.3cqw);line-height:1;opacity:.55;color:inherit}
.it .grip:hover{opacity:1;background:rgba(0,0,0,.1)}
.it .tx{display:block;min-width:0;overflow:hidden}
/* a driver is a brick: colour, three dots, a caps label */
.it.drv{background:var(--bg);color:var(--fg);padding:.75cqw 2.4cqw .7cqw .9cqw;display:flex;flex-direction:column;gap:.45cqw;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.it.drv .dots{font-size:max(9px,1.05cqw)}
.it.drv .dots i{background:var(--dot)}
.it.drv .tx{font-weight:700;font-size:max(10px,1.08cqw);line-height:1.12;text-transform:uppercase;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.it.own{background:var(--white);color:var(--black);padding:.75cqw 2.4cqw .7cqw .9cqw;display:flex;flex-direction:column;gap:.45cqw}
.it.own .dots{font-size:max(9px,1.05cqw)}
.it.own .dots i{background:var(--black)}
.it.own .tx{font-weight:700;font-size:max(10px,1.08cqw);line-height:1.12;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.it.own.blank{background:transparent;outline:2px dashed var(--black);outline-offset:-2px;cursor:pointer;justify-content:center;align-items:center;padding:0 .9cqw}
.it.own.blank .tx{font-size:max(11px,1.15cqw)}
/* a risk is a spine panel */
.it.risk{background:var(--cream);display:grid;grid-template-columns:max(10px,1.4cqw) minmax(0,1fr);color:var(--black)}
.it.risk .spine{background:var(--spine)}
.it.risk .in{padding:1.2cqw 1.5cqw 1.3cqw;display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.it.risk .k{font-size:max(10px,1cqw);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson)}
.it.risk .tx{font-family:var(--ff-serif);font-weight:600;font-size:max(13px,1.95cqw);line-height:1.08;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;text-wrap:balance}
.it.sel{outline:4px solid var(--black);outline-offset:3px;z-index:4}
.it.target{outline:4px dashed var(--black);outline-offset:3px;z-index:4}
.lines .ln{fill:none;stroke-linecap:butt}
.lines .ln.big{stroke-width:6}
.lines .ln.subtle{stroke-width:2.5;stroke-dasharray:8 7}
.lines .ln.unset{stroke-width:3;stroke-opacity:.45}
.lines .ln.dr{stroke:var(--black)} .lines .ln.rr{stroke:var(--purple)}
.lines .ln.ex{stroke-opacity:.55}
.lines .ln.on{stroke:var(--crimson);stroke-opacity:1}
.lines .ln.faded{stroke-opacity:.12}
.lines .hit{stroke:transparent;stroke-width:22;fill:none;cursor:pointer}
.lines .tmp{stroke:var(--crimson);stroke-width:3;stroke-dasharray:4 5;fill:none}

/* side panel beside the board: a spine panel that butts the board */
.info{--spine:var(--purple);align-self:stretch}
.info .body{gap:12px;padding:20px 22px;position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}
@media(max-width:1100px){.info .body{position:static;max-height:none}}
.info h3{font-family:var(--ff-serif);font-weight:600;font-size:25px;line-height:1.1;text-wrap:balance}
.info p{font-size:16px;line-height:1.4}
.info .say{background:var(--banana);padding:9px 12px;font-size:15px}
.info .ends{display:flex;flex-direction:column;gap:4px}
.info .ends span{font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.15}
.info .ends i{font-style:normal;font-weight:700;font-size:18px;line-height:1}
.seg{display:flex;flex-direction:column;gap:0}
.seg .o{display:grid;grid-template-columns:48px minmax(0,1fr);gap:1px 10px;align-items:center;border:2px solid var(--black);background:var(--white);padding:8px 10px;text-align:left;margin-top:-2px}
.seg .o:first-child{margin-top:0}
.seg .o:hover{background:#EFEFE8}
.seg .o small{grid-column:2;font-size:13px;color:var(--grey);line-height:1.25}
.seg .o b{font-weight:700;font-size:15px;line-height:1.2}
.seg .o[aria-pressed="true"]{background:var(--black);color:var(--white);position:relative;z-index:1}
.seg .o[aria-pressed="true"] small{color:var(--white);opacity:.8}
.seg .o svg{grid-row:span 2}
.seg .o[aria-pressed="true"] svg line,.seg .o[aria-pressed="true"] svg path{stroke:var(--white)}
.seg .o[aria-pressed="true"] svg .fillme{fill:var(--white)}
.mylines{display:flex;flex-direction:column;gap:0}
.mylines button{border:0;border-top:1.5px solid var(--rule);background:transparent;text-align:left;padding:8px 2px;font-size:14px;line-height:1.3;display:flex;justify-content:space-between;gap:10px}
.mylines button:hover{background:rgba(0,0,0,.05)}
.mylines em{font-style:normal;font-size:12px;font-weight:700;color:var(--grey);white-space:nowrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:14px;border-top:1.5px solid var(--rule);padding-top:12px}
.legend .k{display:flex;align-items:center;gap:10px}
.count{font-size:15px;font-weight:700}
.btn{border:0;font-weight:700;padding:11px 16px;font-size:15px}
.btn:hover{filter:brightness(.92)}
.btn.k{background:var(--black);color:var(--white)} .btn.l{background:var(--sky)} .btn.w{background:var(--coral)} .btn.o{background:transparent;border:2px solid var(--black);padding:9px 14px}
.info input{border:2px solid var(--black);background:var(--white);padding:10px 12px;font-size:16px;width:100%;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* look back */
.stats{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,2fr)}
@media(max-width:820px){.stats{grid-template-columns:1fr}}
.stats .v{font-family:var(--ff-serif);font-weight:600;font-size:clamp(30px,1rem + 2vw,58px);line-height:1;font-variant-numeric:tabular-nums}
.stats .v.w{font-size:clamp(22px,1rem + .8vw,30px);line-height:1.1}
.stats .s{font-size:16px;line-height:1.4}
.rounds{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,18px)}
.rounds.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.rounds.two{grid-template-columns:1fr}}
.rounds textarea{border:2px solid var(--black);background:var(--white);padding:10px 12px;font-size:17px;line-height:1.35;resize:vertical;min-height:64px;width:100%;max-width:900px}

/* together */
.mine pre{white-space:pre-wrap;font-family:var(--ff-sans);font-size:15px;line-height:1.45;margin:0;max-height:320px;overflow:auto;background:var(--white);padding:12px 14px;border:2px solid var(--black)}
.toast{font-weight:700;font-size:15px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--banana);padding:10px 14px}
.warnline{background:var(--banana);padding:9px 12px;font-size:15px;max-width:70ch}

/* ---------- foot ---------- */
.pfoot{display:flex;justify-content:space-between;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:var(--field);z-index:15;transition:background-color .36s var(--ease)}
.pfoot button{border:0;font-weight:700;padding:13px 20px;font-size:17px;display:flex;align-items:center;gap:10px}
.pfoot button:hover{filter:brightness(.92)}
.pfoot .back{background:var(--cream)}
.pfoot .next{background:var(--banana);color:var(--black)}
.pfoot button:disabled{opacity:.4;cursor:default}
.pfoot button[hidden]{display:none}
.keys{font-size:13px;color:var(--white);opacity:.85;align-self:center;text-align:center}
@media(max-width:560px){.keys{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* editing the page's own words (organisers only) */
html.editmode [data-copy]{outline:2px dashed #E08850;outline-offset:2px;cursor:text}
html.editmode [data-copy]:hover{outline-style:solid;background-color:rgba(224,136,80,.16)}
#ed{position:fixed;z-index:60;background:var(--white);border:2px solid var(--black);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;display:flex;flex-direction:column;gap:8px}
#ed[hidden]{display:none!important}
#ed textarea{border:2px solid var(--black);padding:10px 12px;font-size:17px;line-height:1.4;resize:vertical;width:100%}
#ed .hint{font-size:14px;color:var(--grey)}
.edacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edacts .btn{padding:9px 14px;font-size:15px}
#edbar{position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:6px;align-items:flex-start;max-width:min(380px,calc(100vw - 32px))}
#edbar[hidden]{display:none!important}
#edtoggle{border:2px solid var(--black);background:var(--white);font-weight:700;padding:9px 14px;font-size:15px}
#edtoggle[aria-pressed="true"]{background:#E08850}
#edtip,#edstatus{background:var(--black);color:var(--white);font-size:14px;padding:8px 12px}
#edtip[hidden],#edstatus[hidden]{display:none!important}

/* ====================================================================
   The map stage (steps 1 to 3): a dark-blue field like the Session 5 risk map.
   Set up: your room, then six group circles. The chosen circle grows into the top-right corner,
   its risks hang below it, and the drivers drift loose in the open space for you to drag onto them.
   ==================================================================== */
body.st-stage{--field:#263F60}
body.st-stage .keys{color:var(--white)}
.pbody:empty{display:none}
.stagewrap{--abyss:#263F60;display:block;margin-bottom:clamp(14px,1.8vw,24px);min-width:0}
.stagewrap[hidden]{display:none}
.stage{position:relative;overflow:hidden;overflow:clip;background:var(--abyss);color:var(--white);height:var(--sh,520px);isolation:isolate;
  transition:height .75s var(--ease);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.stage *{box-sizing:border-box}

/* set-up header: the room, then the group */
.st-top{position:absolute;left:clamp(16px,2.4vw,34px);top:clamp(14px,2vw,24px);right:clamp(16px,2.4vw,34px);z-index:4;display:flex;flex-direction:column;gap:clamp(14px,1.6vw,22px);
  transition:opacity .4s var(--ease)}
.stage[data-phase="work"] .st-top{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s linear .3s}
.st-room{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.st-rq{font-family:var(--ff-serif);font-weight:600;font-size:clamp(20px,.9rem + .7vw,26px);line-height:1.1;color:var(--white);flex:0 0 auto}
.st-rms{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
.st-rm{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--white);font-weight:700;font-size:15px;padding:0;
  transition:background-color .15s,border-color .15s,color .15s,transform .15s var(--ease)}
.st-rm:hover{border-color:#fff;transform:scale(1.07)}
.st-rm[aria-pressed="true"]{background:#F0E060;border-color:#F0E060;color:#0A0A0A}
.st-rm:focus-visible{outline:3px solid #fff;outline-offset:2px}
.st-head{display:flex;flex-direction:column;gap:6px;max-width:80ch}
.st-head .eyebrow{color:var(--sky)}
.st-head .st-h{font-family:var(--ff-serif);font-weight:600;font-size:clamp(26px,1rem + 1.6vw,42px);line-height:1;letter-spacing:-.01em;color:var(--white)}
.st-hd-text{min-height:76px;display:flex;flex-direction:column;gap:6px}
.st-head .st-p{font-size:15px;line-height:1.4;color:rgba(255,255,255,.9);max-width:78ch}
.st-head .st-rl{font-size:14px;line-height:1.35;color:var(--sky)}
.st-head .st-rl b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
.st-head .st-rl span{font-family:var(--ff-serif);font-weight:600;font-size:16px}
.st-head .st-rl .sep{font-family:inherit;font-weight:400}
.stage.narrow .st-hd-text{min-height:120px}

/* the group circles */
.st-hubs{position:absolute;inset:0;z-index:1}
.st-hub{position:absolute;left:0;top:0;width:var(--d,0px);height:var(--d,0px);transform:translate(var(--x,0px),var(--y,0px));
  border:0;border-radius:50%;background:var(--c);color:#0A0A0A;padding:0;cursor:pointer;z-index:1;
  outline:2px dashed transparent;outline-offset:9px;
  transition:transform .75s var(--ease),width .75s var(--ease),height .75s var(--ease),opacity .5s var(--ease),background-color .45s,color .45s,box-shadow .45s,outline-color .3s}
.stage button.st-hub:active:not(:disabled){transform:translate(var(--x,0px),var(--y,0px))}
.st-hub-in{position:absolute;left:var(--ix,50%);top:var(--iy,50%);width:var(--iw,74%);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.45em;text-align:center;
  transition:left .75s var(--ease),top .75s var(--ease),width .75s var(--ease)}
.st-hub-n{font-family:var(--ff-serif);font-weight:600;font-size:var(--hf,18px);line-height:1.08;text-wrap:balance;transition:font-size .75s var(--ease)}
.st-hub-k{font-weight:700;font-size:var(--kf,11px);letter-spacing:.14em;text-transform:uppercase;transition:font-size .75s var(--ease)}
.st-hub.on{z-index:2;box-shadow:0 0 0 calc(var(--d,100px) * .04) color-mix(in srgb,var(--c) 26%,transparent),0 0 70px color-mix(in srgb,var(--c) 34%,transparent)}
.st-hub.chosen{outline-color:color-mix(in srgb,var(--c) 80%,transparent)}
.st-hub:focus-visible{outline:3px solid #fff;outline-offset:5px}
.stage[data-focus] .st-hub:not(.on){background:color-mix(in srgb,var(--c) 15%,var(--abyss));color:color-mix(in srgb,var(--c) 52%,var(--abyss))}
@supports not (color:color-mix(in srgb,red,blue)){.stage[data-focus] .st-hub:not(.on){opacity:.3}}
.stage[data-phase="work"] .st-hub.main{cursor:default;pointer-events:none;z-index:1}
.st-hub.off{opacity:0;visibility:hidden;pointer-events:none;transition:transform .75s var(--ease),width .75s var(--ease),height .75s var(--ease),opacity .5s var(--ease),visibility 0s linear .75s}

/* connections falling out of the corner circle */
.st-teth,.st-lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.st-teth{z-index:0}
.st-teth path{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.75}
.st-lines{z-index:2;transition:opacity .4s var(--ease)}
.stage .lines .ln{fill:none;stroke-linecap:butt;transition:stroke-width .18s var(--ease),stroke-opacity .18s var(--ease),filter .18s var(--ease)}
.stage .lines .ln.dr{stroke:#FFFFFF}
.stage .lines .ln.rr{stroke:#E3B5EA}
.stage .lines .ln.unset{stroke-opacity:.8}
.stage .lines .ln.dim{stroke-opacity:.35}
.stage .lines .ln.on{stroke:#F0E060;stroke-opacity:1;stroke-width:7;stroke-dasharray:none;filter:drop-shadow(0 0 3px rgba(240,224,96,.9)) drop-shadow(0 0 10px rgba(240,224,96,.55))}
.stage .lines .ln.on.subtle{stroke-width:5}
.stage .lines .lg:hover .ln:not(.on){stroke-opacity:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 11px rgba(176,222,255,.75))}
.stage .lines .lg:hover .ln.big:not(.on){stroke-width:8}
.stage .lines .lg:hover .ln.subtle:not(.on),.stage .lines .lg:hover .ln.unset:not(.on){stroke-width:4.5}
.stage .lines .lg:hover .ln.rr:not(.on){stroke-width:6}
.stage .lines .tmp{stroke:#F0E060;stroke-width:3;stroke-dasharray:4 5;fill:none}
.stage .lines .hit{fill:none;stroke:transparent;stroke-width:20;stroke-linecap:round;pointer-events:stroke;cursor:pointer}


.st-it:focus-visible{outline:3px solid #fff;outline-offset:3px}
.st-it .more{display:none}
.st-it .cnt{flex:0 0 auto;font-size:11px;font-weight:700;background:#fff;color:#0A0A0A;border-radius:999px;padding:0 6px;line-height:16px}

/* ---- once you are working on the group ---- */
.st-cap,.st-done,.st-legend{display:none}
.stage[data-act] .st-cap{display:flex;align-items:center;gap:12px;position:absolute;left:clamp(14px,2vw,26px);top:16px;max-width:min(560px,calc(100% - 300px));z-index:4;
  font-size:15px;line-height:1.35;color:rgba(255,255,255,.9);pointer-events:none;min-height:44px}
.st-cap .ic{flex:0 0 auto}
.st-cap.hot{font-family:var(--ff-serif);font-weight:600;font-size:clamp(19px,1rem + .5vw,24px);line-height:1.12;color:#fff}
.stage.narrow[data-act] .st-cap{max-width:calc(100% - 190px);font-size:13.5px;flex-direction:column;align-items:flex-start;gap:6px}
.stage.narrow .st-cap.hot{font-size:17px}
.stage[data-act] .st-done{display:block;position:absolute;right:clamp(14px,2vw,26px);bottom:clamp(14px,2vw,26px);z-index:6;background:#F0E060;color:#0A0A0A;font-size:17px;padding:14px 22px;
  box-shadow:0 8px 22px rgba(0,0,0,.35)}
.stage.narrow[data-act] .st-done{left:14px;right:14px;text-align:center}
.stage[data-act] .st-legend{display:flex;flex-wrap:wrap;gap:6px 18px;position:absolute;left:clamp(14px,2vw,26px);bottom:clamp(16px,2vw,28px);z-index:4;font-size:13px;color:rgba(255,255,255,.82);pointer-events:none}
.stage.narrow[data-act] .st-legend{bottom:80px}
.st-legend .k{display:inline-flex;align-items:center;gap:8px}

/* the drivers: loose rectangles in the open water */
.st-rail{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;pointer-events:none}
.st-drv,.st-own{position:absolute;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:11px 14px;border:0;text-align:left;pointer-events:auto;cursor:grab;
  font-weight:700;font-size:13px;line-height:1.16;text-transform:uppercase;letter-spacing:.01em;touch-action:none;
  box-shadow:0 6px 16px rgba(0,0,0,.28);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .2s}
.st-drv{background:var(--bg);color:var(--fg)}
.st-drv .tx,.st-own .tx{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.st-drv .more{flex:0 0 100%;text-transform:none;font-weight:500;font-size:12.5px;line-height:1.4;letter-spacing:0;color:rgba(255,255,255,.95);padding-top:6px;border-top:1px solid rgba(255,255,255,.4);margin-top:6px}
.st-own{background:rgba(255,255,255,.06);color:#fff;outline:1.5px dashed rgba(255,255,255,.7);outline-offset:-1.5px;box-shadow:none}
.st-own:not(.blank){background:#0A0A0A;color:#fff;outline:0;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.st-own .more{flex:0 0 100%;text-transform:none;margin-top:6px}
.ownin{width:100%;border:0;border-bottom:2px solid #F0E060;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:500;padding:6px 8px;text-transform:none;letter-spacing:0}
.ownin::placeholder{color:rgba(255,255,255,.6)}
.st-drv:hover,.st-own:hover,.st-drv:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 28px rgba(0,0,0,.42);z-index:4}
.st-drv:active{cursor:grabbing}
.st-drv.sel,.st-own.sel{transform:translateY(-4px) scale(1.03);z-index:6;outline:3px solid #fff;outline-offset:3px;cursor:grab}
.st-own.sel{cursor:text}
.st-drv.sel .more,.st-own.sel .more{display:block}
.st-drv.target,.st-own.target{outline:3px dashed #F0E060;outline-offset:3px;z-index:6}
/* the knob that says "pull a line from here" */
.st-drv::after,.st-own:not(.blank)::after{content:"";position:absolute;right:-8px;top:18px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 3px var(--bg,#0A0A0A),0 2px 8px rgba(0,0,0,.4);opacity:0;transform:scale(.3);transition:opacity .16s,transform .2s var(--ease);pointer-events:none}
.st-own:not(.blank){--bg:#0A0A0A}
.st-drv:hover::after,.st-own:not(.blank):hover::after,.st-drv.sel::after,.st-own.sel::after,.st-drv:focus-visible::after{opacity:1;transform:none}

.stage.dragging{cursor:grabbing}
.stage.dragging .st-it:not(.sel):not(.target){pointer-events:none}

/* the card beside a clicked line: the line, read as a sentence, and two small choices */
.st-card{position:absolute;z-index:8;display:flex;flex-direction:column;gap:12px;padding:16px 18px 14px;background:#FFFDF2;color:#0A0A0A;border-left:6px solid #F0E060;
  box-shadow:0 18px 40px rgba(0,0,0,.45);animation:st-in .22s var(--ease) both}
.st-card[hidden]{display:none}
.st-card .sent{font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.25;text-wrap:pretty}
.st-card .sent em{font-style:normal;font-weight:600;background:linear-gradient(transparent 62%,#F0E060 62%);padding:0 1px}
.st-card .cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.st-card .lbl{flex:0 0 74px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4A5560}
.st-card .tg{border:1.5px solid rgba(10,10,10,.28);background:transparent;color:#0A0A0A;font-weight:600;font-size:14px;line-height:1;padding:8px 11px;border-radius:999px;cursor:pointer;

/* the X on each line */
.st-xs{position:absolute;inset:0;z-index:4;pointer-events:none;transition:opacity .3s var(--ease)}
.stage.moving .st-xs,.stage.swap .st-xs,.stage.dragging .st-xs,.st-enter .st-xs{opacity:0}
.st-x{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #FDFCF3;background:#1C3150;color:#FDFCF3;
  font-size:17px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0 0 2px;pointer-events:auto;cursor:pointer;opacity:.8;
  transition:transform .15s var(--ease),background-color .15s,border-color .15s,opacity .15s}
.st-x:hover,.st-x.on{opacity:1;background:#C0184F;border-color:#C0184F;transform:scale(1.15)}
.st-x:focus-visible{outline:3px solid #F0E060;outline-offset:2px}

/* the pop-up for a driver or a risk */
.st-pop{position:absolute;z-index:9;width:min(340px,calc(100% - 24px));background:#FDFCF3;color:#0A0A0A;box-shadow:0 18px 44px rgba(0,0,0,.45);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;animation:st-in .25s var(--ease) both}
.st-pop[hidden]{display:none}
.st-pop.dragging,.st-card.dragging{cursor:grabbing;box-shadow:0 26px 56px rgba(0,0,0,.52)}
.st-pop .pbar{height:10px;background:var(--pc,#C0184F)}
.st-pop .pin{padding:12px 18px 16px;display:flex;flex-direction:column;gap:8px}
.st-pop .phd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-pop .phd .eyebrow{color:#4A5560;font-size:11px}
.st-pop .px{border:0;background:transparent;color:#0A0A0A;font-size:24px;line-height:1;padding:0 4px;cursor:pointer;margin-right:-6px}
.st-pop .px:hover{color:#C0184F}
.st-pop .pt{font-family:var(--ff-serif);font-weight:600;font-size:22px;line-height:1.12;text-wrap:balance}
.st-pop .pb{font-size:16px;line-height:1.45;text-wrap:pretty}
.st-pop .ph{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.3;background:#F0E060;padding:9px 11px;margin-top:4px}
.st-pop .ph svg circle{fill:#0A0A0A}.st-pop .ph svg path{stroke:#0A0A0A}.st-pop .ph svg circle:last-child{fill:none;stroke:#0A0A0A}
.st-pop .pc{font-size:13px;font-weight:700;color:#4A5560}
.st-card{cursor:grab;touch-action:none}
.st-card button{cursor:pointer}

/* the arrow beside the risk: the next risk in your group */
.st-next{position:absolute;z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:#FDFCF3;color:#0A0A0A;display:grid;place-items:center;padding:0;
  box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .2s var(--ease),opacity .4s var(--ease),background-color .2s}
.st-next[hidden]{display:none}
.st-next svg{width:26px;height:26px}
.st-next .nl{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:104px;text-align:center;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;line-height:1.3;pointer-events:none}
.st-next:hover{background:#F0E060;transform:translateX(4px)}
.st-next:focus-visible{outline:3px solid #F0E060;outline-offset:3px}
.stage.moving .st-next,.stage.swap .st-next,.stage.zooming .st-next{opacity:0;pointer-events:none}
.st-enter .st-next{animation:st-in .7s var(--ease) both;animation-delay:2s}

/* link the risks: a risk map around your risk */
.stage[data-view="link"] .w-hub .hn,.stage[data-view="link"] .w-hub .hk{display:none}
.stage[data-view="link"] .w-lab .lr{display:none}
.stage[data-view="link"] .w-lab{width:210px;pointer-events:auto;cursor:pointer}
.stage[data-view="link"] .w-lab .lt{font-size:clamp(15px,.8rem + .25vw,18px);line-height:1.18}
.stage[data-view="link"] .w-lab:hover .lt{text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.5)}
.w-lab.ra{text-align:right}.w-lab.ca{text-align:center}
.w-sat.oth{cursor:pointer}
.w-sat.oth::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);animation:st-invite 2.8s ease-out infinite;pointer-events:none}
@keyframes st-invite{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.w-sat.oth:hover{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 40%,transparent)}
.w-sat.oth.sel{box-shadow:0 0 0 4px #1C3150,0 0 0 8px #F0E060}
.w-sat.oth.target{box-shadow:0 0 0 4px #1C3150,0 0 0 9px #F0E060,0 0 30px 8px rgba(240,224,96,.5)}
.stage.armed .w-sat.oth::after,.stage.dragging .w-sat.oth::after{animation-duration:1.3s;border-color:#F0E060}
.w-sat.oth .cnt{top:-11px;right:-11px}
.stage.dragging .st-it.w-sat.oth:not(.sel):not(.target){pointer-events:auto}
@media(prefers-reduced-motion:reduce){.stage::before,.w-sat.oth::after{animation:none}}
.stage.dragging .st-pop,.stage.dragging .st-card{pointer-events:none;opacity:.35;transition:opacity .2s}

/* ================= October 19, later: readable labels, risks that open to be read, lines in their driver's colour ================= */
/* risk names on the map always sit on a soft dark backing */
.w-lab{align-items:flex-start}
.w-lab.ra{align-items:flex-end;text-align:right}
.w-lab.ca{align-items:center;text-align:center}
.w-lab .lt,.w-lab .lr{width:fit-content;max-width:100%;background:rgba(20,36,62,.74);padding:3px 9px 4px;border-radius:3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.w-lab .lr{padding:2px 9px;margin-top:-3px}
.w-lab{gap:3px}

/* the risk in the middle, closed: its name and an invitation to open it */
.w-in .rm{display:inline-flex;align-items:center;gap:6px;margin-top:calc(var(--r,100px) * .03);font-weight:700;font-size:clamp(11px,calc(var(--r,100px) * .055),14px);
  letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(10,10,10,.14)}
.w-in .rm::after{content:"+";font-size:1.4em;line-height:.6;font-weight:400}
.w-sat.focus:not(.open):hover .rm{background:rgba(10,10,10,.24)}
.w-sat.focus:not(.open) .w-in .t{font-size:clamp(20px,calc(var(--r,100px) * .17),48px)}

/* open: the circle grows and holds the full Risk Wall text, scrolling inside it */
.w-sat.open .w-in{opacity:1;pointer-events:auto;width:calc(var(--r,200px) * 1.34);max-height:calc(var(--r,200px) * 1.52);gap:calc(var(--r,200px) * .03);position:relative}
.w-sat.open .w-in .t{font-size:clamp(20px,calc(var(--r,200px) * .1),40px)}
.w-sat.open .df{flex:1 1 auto;min-height:0;overflow:auto;text-align:left;font-size:clamp(14px,calc(var(--r,200px) * .052),18px);line-height:1.5;padding:4px 14px 18px 2px;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 82%,transparent 100%);
  scrollbar-width:thin;scrollbar-color:rgba(10,10,10,.35) transparent;cursor:text;user-select:text;-webkit-user-select:text}
.w-sat.open .df p{margin:0 0 .75em}
.w-sat.open .df strong{font-weight:700}
.w-sat.open .df:focus-visible{outline:2px solid rgba(10,10,10,.5);outline-offset:4px}
.w-sat .wclose{position:absolute;top:-6px;right:-14px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,10,10,.16);color:#0A0A0A;font-size:22px;line-height:1;
  display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.w-sat .wclose:hover{background:#0A0A0A;color:#fff}
.w-sat.open{cursor:default;z-index:6}
.w-sat.open.oth::after{display:none}
.stage.moving .w-sat.open .w-in,.stage.regrow .w-sat.open .w-in{opacity:0;transition:opacity .2s}
.w-sat.open .w-in{transition:opacity .5s .1s var(--ease)}
.stage[data-mode="link"] .w-sat.open{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 26%,transparent),0 24px 60px rgba(0,0,0,.4)}

/* blocks glide when the circle opens or closes */
.stage[data-act] .st-rail>.st-drv,.stage[data-act] .st-rail>.st-own{transition:left .85s var(--ease),top .85s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease),background-color .2s}
.stage[data-act] .st-done.slot{transition:left .85s var(--ease),top .85s var(--ease),background-color .2s}
.stage.st-still .st-rail>*,.stage.st-still .st-done{transition:none!important}
.stage.regrow .st-lines,.stage.regrow .st-xs{opacity:0}

/* lines: thicker, in the driver's colour; a main driver thicker still, "plays a part" fainter */
.stage .lines .ln{filter:drop-shadow(0 1px 4px rgba(8,18,36,.7))}
.stage .lines .ln.unset{stroke-width:6;stroke-opacity:.95;stroke-dasharray:none}
.stage .lines .ln.big{stroke-width:12;stroke-opacity:1;stroke-dasharray:none}
.stage .lines .ln.subtle{stroke-width:6;stroke-opacity:.45;stroke-dasharray:none}
.stage .lines .ln.rr{stroke-width:6}
.stage .lines .ln.rr.big{stroke-width:12}
.stage .lines .ln.on{stroke-opacity:1;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px rgba(255,255,255,.65))}
.stage .lines .ln.on.subtle{stroke-opacity:.75}
.stage .lines .ln.dim{stroke-opacity:.4}
.stage .lines .ln.faded{stroke-opacity:.16}
.stage .lines .lg:hover .ln:not(.on){filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 8px rgba(255,255,255,.5))}

/* the quiet prompt on Link the risks */
.st-hint{position:absolute;z-index:5;display:flex;align-items:center;gap:12px;max-width:300px;margin:0;color:#fff;font-weight:700;font-size:16px;line-height:1.35;
  text-shadow:0 1px 6px rgba(8,18,36,.8);pointer-events:none;animation:st-in .5s var(--ease) both}
.st-hint[hidden]{display:none}
.st-hint .ic{flex:none}
.w-sat.open .cnt{display:none}
.stage.is-open[data-mode="draw"] .st-drv,.stage.is-open[data-mode="draw"] .st-own{font-size:clamp(15px,.55rem + .5vw,21px);min-height:0;padding:12px 16px}
.stage.narrow .st-next .nl{display:none}.stage.narrow .st-next{width:48px;height:48px}

/* ================= October 21: every line one mustard colour with a solid arrowhead; the arrow card; Part 2 ================= */
.stage{--link:#E0C060}
.stage .lines .lg .ln,.stage .lines .lg .ln.dr,.stage .lines .lg .ln.rr,.stage .lines .lg .ln.on{stroke:var(--link);stroke-opacity:1;stroke-linecap:butt;filter:none}
.stage .lines .lg .ah{fill:var(--link)}
.stage .lines .lg{filter:drop-shadow(0 1px 4px rgba(8,18,36,.75));transition:opacity .18s var(--ease)}
.stage .lines .lg.ex{opacity:.6}
.stage .lines .lg.dim{opacity:.62}
.stage .lines .lg.faded{opacity:.22}
.stage .lines .lg.on{opacity:1;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px rgba(255,255,255,.7))}
.stage .lines .lg:hover:not(.on){filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 8px rgba(255,255,255,.55))}
.stage .lines .lg .ln.faded,.stage .lines .lg .ln.dim{stroke-opacity:1}
.st-legend .k svg{flex:none}

/* the card: a large mustard panel, cut like an arrow on its right, black words, cream blocks to choose from */
.stage .st-card{background:var(--link);color:#0A0A0A;border:0;padding:22px 66px 20px 26px;gap:16px;box-shadow:none;border-radius:0;
  clip-path:polygon(0 0,calc(100% - 38px) 0,100% 50%,calc(100% - 38px) 100%,0 100%);
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.45))}
.stage .st-card.dragging{filter:drop-shadow(0 26px 34px rgba(0,0,0,.55))}
.st-card .cx{position:absolute;top:14px;right:50px;width:38px;height:38px;border:0;border-radius:0;background:#FDFCF3;color:#0A0A0A;font-size:26px;line-height:1;
  display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.st-card .cx:hover{background:#0A0A0A;color:#FDFCF3}
.st-card .says{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding-right:44px}
.st-card .says::before{content:"";flex:none;width:30px;height:12px;background:#0A0A0A;clip-path:polygon(0 38%,62% 38%,62% 0,100% 50%,62% 100%,62% 62%,0 62%)}
.stage .st-card .sent{font-family:var(--ff-serif);font-weight:600;font-size:clamp(22px,1rem + .6vw,27px);line-height:1.22;margin:0;text-wrap:pretty}
.stage .st-card .sent em{font-style:normal;background:#FDFCF3;padding:1px 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stage .st-card .cr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stage .st-card .lbl{flex:0 0 100%;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#0A0A0A;opacity:.8}
.stage .st-card .tg{border:0;border-radius:0;background:#FDFCF3;color:#0A0A0A;font-weight:700;font-size:16px;line-height:1.1;padding:11px 16px;cursor:pointer;
  box-shadow:inset 0 0 0 2px transparent;transition:background-color .15s,color .15s,box-shadow .15s}
.stage .st-card .tg:hover{box-shadow:inset 0 0 0 2px #0A0A0A}
.stage .st-card .tg[aria-pressed="true"]{background:var(--on,#0A0A0A);color:var(--onfg,#fff);box-shadow:inset 0 0 0 3px #0A0A0A}
.stage .st-card .tg[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.stage .st-card .cr.end{justify-content:flex-start;gap:8px;border-top:2px solid rgba(10,10,10,.18);padding-top:16px;margin-top:0}
.stage .st-card .lk{text-decoration:none;font-size:15px;padding:10px 14px}
.stage .st-card .lk.b{margin-left:auto;background:#0A0A0A;color:#FDFCF3}
.stage .st-card .lk.b:hover{background:#FDFCF3;color:#0A0A0A}
@media(max-width:719px){
  .stage .st-card{padding:18px 44px 16px 18px;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%)}
  .st-card .cx{right:34px;top:10px}
  .stage .st-card .sent{font-size:21px}
  .stage .st-card .tg{font-size:15px;padding:10px 12px}
}

/* Part 2 */
.stage[data-phase="p2"] .st-done{display:none}
.stage[data-phase="p2"] .st-intro{opacity:0;transform:translateY(-12px);visibility:hidden;pointer-events:none}
.stage[data-phase="p2"] .st-rail,.stage[data-phase="p2"] .st-risks{display:none}
.p2box{position:absolute;z-index:5;display:flex;flex-direction:column;gap:12px;padding:22px 24px 22px;background:var(--bg);color:#FFFFFF;font-family:var(--ff-sans);
  box-shadow:0 22px 50px rgba(0,0,0,.45);transition:left .5s var(--ease),top .5s var(--ease),background-color .3s}
.stage.st-still .p2box{transition:none}
.p2hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.p2hd .eyebrow{color:#FFFFFF;opacity:.9}
.p2arr{display:flex;gap:6px}
.p2arr button{width:36px;height:36px;border:0;background:rgba(255,255,255,.18);color:#FFFFFF;font-size:18px;font-weight:700;line-height:1;cursor:pointer;padding:0 0 2px}
.p2arr button:hover{background:#FFFFFF;color:#0A0A0A}
.p2t{margin:0;font-family:var(--ff-sans);font-weight:700;text-transform:uppercase;font-size:clamp(24px,1rem + 1.1vw,36px);line-height:1.08;letter-spacing:.005em;text-wrap:balance}
.p2d{margin:0;font-size:clamp(16px,.85rem + .3vw,19px);line-height:1.45;font-weight:500}
.p2acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.p2acts button,.p2sv{border:0;border-radius:0;background:#FDFCF3;color:#0A0A0A;font-family:var(--ff-sans);font-weight:700;font-size:15px;padding:10px 14px;cursor:pointer}
.p2acts button:hover,.p2sv:hover{background:#0A0A0A;color:#FDFCF3}
.p2acts button[aria-expanded="true"]{background:#0A0A0A;color:#FDFCF3}
.p2more,.p2w{display:flex;flex-direction:column;gap:8px;border-top:2px solid rgba(255,255,255,.4);padding-top:12px}
.p2h{margin:0;font-weight:700;font-size:13px;letter-spacing:.13em;text-transform:uppercase}
.p2ph{margin:0;font-size:15px;line-height:1.45;opacity:.92}
.p2top{margin:0;padding:0 0 0 18px;font-size:15px;line-height:1.5}
.p2w textarea{width:100%;box-sizing:border-box;min-height:84px;border:0;border-radius:0;padding:10px 12px;font:inherit;font-size:16px;line-height:1.4;color:#0A0A0A;background:#FDFCF3;resize:vertical}
.p2w textarea:focus{outline:3px solid #0A0A0A;outline-offset:0}
.p2wa{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.p2st{font-weight:700;font-size:14px}
.st-explore .xb.p2c i{width:22px;height:22px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;border-radius:0}
.stage[data-phase="p2"] .st-explore .xb{font-size:14px}
.stage.narrow[data-phase="p2"] .st-explore .xb.p2c{padding:4px}
.stage.narrow[data-phase="p2"] .st-explore .xb.p2c span{display:none}
.stage.narrow[data-phase="p2"] .st-explore .xb.p2c i{width:30px;height:30px;font-size:14px}
.stage.narrow[data-phase="p2"] .st-explore .xl{flex-basis:100%}
.stage[data-phase="p2"] .w-sat.p2on{cursor:pointer}
.stage[data-phase="p2"] .w-sat.p2sel{box-shadow:0 0 0 4px #1C3150,0 0 0 8px var(--link)}
.stage[data-phase="p2"] .w-lab{pointer-events:auto;cursor:pointer;width:210px}
.stage[data-phase="p2"] .w-lab .lr{display:none}
.stage[data-phase="p2"] .w-lab .lt{font-size:clamp(15px,.8rem + .25vw,18px);line-height:1.18}
.stage[data-phase="p2"] .w-hub .hn,.stage[data-phase="p2"] .w-hub .hk{display:none}
.p2n{position:absolute;left:0;top:0;transform:translate(-50%,-50%);min-width:30px;height:26px;padding:0 8px;border:2px solid #1C3150;border-radius:999px;background:var(--link);
  color:#0A0A0A;font-family:var(--ff-sans);font-weight:700;font-size:13px;line-height:1;display:grid;place-items:center;pointer-events:auto;cursor:pointer;transition:transform .15s var(--ease)}
.p2n:hover,.p2n.on{transform:translate(-50%,-50%) scale(1.15);background:#FDFCF3}
.p2bars{display:flex;flex-direction:column;gap:8px}
.p2bar{display:grid;grid-template-columns:34px minmax(60px,120px) 1fr;align-items:center;gap:10px;font-size:15px;font-weight:600}
.p2bar .bv{font-weight:700;font-size:20px;text-align:right}
.p2bar .bt{height:12px;background:rgba(10,10,10,.16)}
.p2bar .bt i{display:block;height:100%;background:#0A0A0A}
@media(max-width:719px){.p2bar{grid-template-columns:30px 70px 1fr;font-size:14px}}

/* ================= October 21, evening: joining with a name; Our room ================= */
/* the header: the room number (back to set up) and your name */
.bar-room{position:relative;flex-wrap:wrap;gap:8px 12px}
.roombtn{border:2px solid var(--black);background:var(--white);color:var(--black);font-weight:700;font-size:16px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.roombtn:hover{background:var(--black);color:var(--white)}
.roombtn:focus-visible,#myname:focus-visible{outline:3px solid var(--crimson);outline-offset:2px}
.bar-room .mel{font-weight:700;font-size:15px;white-space:nowrap}
#myname{border:2px solid var(--black);background:var(--white);color:var(--black);padding:7px 10px;font:inherit;font-weight:600;font-size:16px;width:9.5em;min-width:0;border-radius:0}
#myname.pulse{animation:hp-pulse 1s ease-in-out 3}
@keyframes hp-pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,24,79,0)}50%{box-shadow:0 0 0 7px rgba(192,24,79,.55)}}
.mecall{position:absolute;top:calc(100% + 10px);right:14px;z-index:40;background:var(--crimson);color:#fff;font-weight:700;font-size:15px;padding:9px 13px;white-space:nowrap;
  box-shadow:0 10px 24px rgba(0,0,0,.3);animation:st-in .25s var(--ease) both}
.mecall::before{content:"";position:absolute;bottom:100%;right:34px;border:9px solid transparent;border-bottom-color:var(--crimson)}
@media(prefers-reduced-motion:reduce){#myname.pulse{animation:none;outline:3px solid var(--crimson)}}

/* joining: your name after your room */
.joinrow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.joinin{flex:1 1 180px;min-width:0;border:0;border-bottom:3px solid #F0E060;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:600;font-size:20px;padding:10px 12px;border-radius:0}
.joinin::placeholder{color:rgba(255,255,255,.6)}
.joinin:focus{outline:3px solid #F0E060;outline-offset:2px}
.joingo{font-size:18px;padding:12px 18px}
.joingo:disabled{opacity:.45;cursor:not-allowed}
.joinback,.exgo{align-self:flex-start;border:0;background:none;color:#fff;font:inherit;font-weight:700;font-size:15px;padding:4px 0;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.exgo{background:rgba(255,255,255,.12);text-decoration:none;padding:9px 14px;border:1.5px solid rgba(255,255,255,.6)}
.exgo:hover{background:#F0E060;color:#0A0A0A;border-color:#F0E060}
.joinback:hover{color:#F0E060}

/* your own drivers carry your name */
.st-own .who{flex:0 0 100%;width:100%;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.85;margin-bottom:4px}

/* the steps strip: a lock on Our room until you're finished */
.steps .lock{width:13px;height:13px;flex:none;opacity:.85}

/* look back: share one thing */
.share textarea{width:100%;box-sizing:border-box}
.wc{font-size:14px;font-weight:700;color:#4A5560}
.wc.over{color:var(--crimson)}
.acts.finish{display:flex;justify-content:flex-end;margin-top:4px}

/* Our room on the stage */
.stage[data-mode="room"] .st-done,.stage[data-mode="room"] .st-done.slot{display:none!important}
.st-own.rown{background:var(--pc);color:#0A0A0A;outline:0;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.stage .st-own:not(.blank){flex-direction:column;flex-wrap:nowrap;align-items:flex-start;justify-content:center}
.stage .st-own:not(.blank) .tx{flex:0 0 auto;width:100%}
.stage .st-own .who{flex:0 0 auto}
.st-own.rown .tx{text-transform:none;letter-spacing:0;font-weight:700}
.stage[data-mode="room"] .st-it{cursor:pointer}
.stage[data-mode="room"] .st-drv.unused{opacity:.3}
.stage[data-mode="room"] .st-it.rdim{opacity:.35}
.stage[data-mode="room"] .st-it.rhl{outline:4px solid #FDFCF3;outline-offset:3px;z-index:5}
.stage[data-mode="room"] .st-it.rsel{outline:4px solid #FDFCF3;outline-offset:3px;z-index:6}
.stage[data-mode="room"] .st-it.starred{box-shadow:0 0 0 4px #E0C060,0 0 18px 4px rgba(224,192,96,.55)}
.st-it .rcnt{position:absolute;top:-11px;right:-11px;min-width:28px;height:28px;line-height:24px;padding:0 7px;text-align:center;font-size:14px;font-weight:700;
  background:#FDFCF3;color:#0A0A0A;border:2px solid #1C3150;border-radius:999px;letter-spacing:0;text-transform:none}
.st-it .rstar{position:absolute;bottom:-11px;right:10px;height:24px;line-height:20px;padding:0 8px;font-size:13px;font-weight:700;background:#E0C060;color:#0A0A0A;
  border:2px solid #1C3150;border-radius:999px;letter-spacing:0}
.stage .lines .rhalo{fill:none;stroke:#FDFCF3;stroke-opacity:.5;stroke-linecap:round}
.stage .lines .rhalo.dim{stroke-opacity:.15}
.stage .lines .lg.rhl{opacity:1;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px rgba(255,255,255,.6))}
.p2n.rc{min-width:52px;white-space:nowrap}
.stage.narrow .p2n.rc{display:none}
.p2n.rc b{font-weight:700;margin-left:2px}
.p2n.rc.st{box-shadow:0 0 0 3px #E0C060}
.st-explore .xb.rn i{width:14px;height:14px;border-radius:50%}
.st-explore .xb.rn.all{font-style:normal}

/* the line card in Our room: who drew it, in their colours */
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:baseline;gap:6px;background:var(--pc);color:var(--pf,#0A0A0A);padding:6px 10px;font-size:14px;line-height:1.2}
.rchip b{font-weight:700}
.rchip span{font-weight:500;opacity:.85}
.st-card .nost{flex:0 1 auto;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;opacity:.75}
.st-card .rsn{font-weight:700;font-size:15px}
.st-card .rown-s{margin:0;font-size:15px;font-weight:600}

/* the talking prompts beside the stage */
.st-raside{position:absolute;z-index:5;display:flex;flex-direction:column;gap:10px;color:#fff}
.st-raside[hidden]{display:none}
.st-raside .eyebrow{color:var(--sky)}
.st-raside .rp{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;align-items:start;text-align:left;border:0;background:rgba(255,255,255,.08);color:#fff;
  font:inherit;font-size:16px;line-height:1.35;padding:12px 14px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.st-raside button.rp{cursor:pointer}
.st-raside button.rp:hover{box-shadow:inset 0 0 0 2px #fff}
.st-raside .rp[aria-pressed="true"]{background:#FDFCF3;color:#0A0A0A;box-shadow:none}
.st-raside .rp .n{grid-row:span 2;width:30px;height:30px;display:grid;place-items:center;background:#E0C060;color:#0A0A0A;font-weight:700;font-size:15px}
.st-raside .rp.plain .n{background:rgba(255,255,255,.2);color:#fff}
.st-raside .rp .pq{font-weight:600}
.st-raside .rp em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.st-raside .rph{margin:0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.8)}

/* shared notes under the stage, as post-its */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:6px}
.post{margin:0;background:var(--pc);color:var(--pf,#0A0A0A);padding:16px 16px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:130px;min-width:0;
  box-shadow:0 8px 18px rgba(0,0,0,.18);transform:rotate(-.6deg)}
.post:nth-child(2n){transform:rotate(.7deg)}
.post blockquote{margin:0;font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.post figcaption{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){.post,.post:nth-child(2n){transform:none}}
@media(max-width:719px){
  .bar-room{padding:10px 12px}
  #myname{width:100%;flex:1 1 140px}
  .posts{grid-template-columns:1fr}
}

/* Part 2: the wall of other drivers, and the swap */
.stage[data-phase="p2"] .st-explore{display:block}
.p2grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.p2tile{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;border:0;border-radius:0;background:var(--bg);color:#FFFFFF;
  font-family:var(--ff-sans);font-weight:700;text-transform:uppercase;font-size:clamp(13px,.7rem + .3vw,16px);line-height:1.15;text-align:left;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.28);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.p2tile:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(0,0,0,.4)}
.p2tile:focus-visible{outline:3px solid #F0E060;outline-offset:3px}
.p2tile .k{flex:none;width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:14px}
.p2tile .tx{min-width:0;overflow-wrap:anywhere}
.p2box>*,.p2tile>*{transition:opacity .28s var(--ease)}
.p2box.entering>*,.p2tile.leaving>*{opacity:0}
.stage.p2swap .st-lines,.stage.p2swap .st-xs{opacity:0;transition:none}
.stage.p2swap .p2tile:hover{transform:none}
@media(max-width:719px){.p2grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.p2tile{min-height:56px;padding:8px 12px;font-size:13px}}

/* Part 2: a smaller, see-through driver box so the map and its arrows show; risks pulse to be read */
.p2box{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:16px 18px;gap:9px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.p2t{font-size:clamp(19px,.8rem + .7vw,26px)}
.p2d{font-size:clamp(14px,.8rem + .15vw,16px);line-height:1.4}
.p2acts button,.p2sv{font-size:14px;padding:8px 12px}
.p2arr button{width:32px;height:32px;font-size:16px}
.stage[data-phase="p2"] .w-sat{cursor:pointer}
.stage[data-phase="p2"] .w-sat:not(.open)::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);animation:st-invite 2.8s ease-out infinite;pointer-events:none}
.stage[data-phase="p2"] .w-sat:not(.open):hover{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 40%,transparent)}
.stage[data-phase="p2"] .w-sat.open{z-index:6;box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 26%,transparent),0 24px 60px rgba(0,0,0,.4)}
.stage[data-phase="p2"] .w-hub{cursor:default}
.stage[data-phase="p2"] .w-lab{pointer-events:none}
.stage.narrow[data-phase="p2"] .w-lab{pointer-events:auto}
@media(prefers-reduced-motion:reduce){.stage[data-phase="p2"] .w-sat::after{animation:none}}

/* Part 2: risk names sit above the arrows, a little larger; an open risk is big enough to read */
.stage[data-phase="p2"] .w-world{z-index:auto}
.stage[data-phase="p2"] .w-lab{z-index:7;width:260px}
.stage[data-phase="p2"] .w-lab .lt{font-size:clamp(17px,.9rem + .35vw,21px);line-height:1.2;box-shadow:0 4px 14px rgba(8,18,36,.45)}
.stage[data-phase="p2"] .w-sat.open{z-index:8}
.stage[data-phase="p2"] .w-sat.open .df{font-size:clamp(15px,calc(var(--r,200px) * .056),18px)}

/* ================= October 22: one header bar and green tabs, as on the other activities ================= */
:root{--sea:#5878A0;--bar:#387030;--bar2:#4A8240;--pick:#E0C060;--ice:#FFFFFF;--ink:#0A0A0A;--own:#7A0E2C}
.top{position:relative;background:var(--sea);color:var(--ice)}
.top .wrap{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;min-height:clamp(96px,4.5vw + 70px,140px);padding-top:18px;padding-bottom:18px}
.top .tt{display:flex;flex-direction:column;gap:8px;min-width:0}
.top h1{font-family:var(--ff-serif);font-weight:400;font-size:clamp(32px,1.1rem + 1.9vw,54px);line-height:1;letter-spacing:-.01em;text-transform:none}
.top .tsub{font-size:clamp(16px,.8rem + .45vw,21px);line-height:1.3;color:rgba(255,255,255,.92)}
.tpill{display:flex;align-items:center;gap:8px;flex:none}
#tbtn{border:0;display:inline-flex;align-items:center;gap:9px;background:var(--pick);color:var(--ink);border-radius:999px;padding:6px 18px 6px 7px;font-weight:700;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(10,20,40,.25);transition:transform .2s var(--ease),background-color .3s}
#tbtn:hover{transform:scale(1.04)}
#tbtn:active{transform:translateY(1px)}
#tbtn svg{width:32px;height:32px;flex:none;display:block}
#tbtn .clk{min-width:3.1em;text-align:left}
#tbtn small{font-size:13px;margin-left:3px}
#tbtn.done{background:#E06050}
#tbtn.done .clk{min-width:0;font-size:16px}
.tre{width:32px;height:32px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.16);color:var(--ice);display:grid;place-items:center;transition:background-color .2s}
.tre:hover{background:rgba(255,255,255,.28)}
.tre svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.top .wrap{flex-wrap:wrap;align-items:flex-start}.tpill{margin-left:auto}}

/* the green bar: the tab you're on sits on a lighter green with a white line under it; the bonus sits on its own at the far end */
.steps{background:var(--bar)}
.steps ol{background:none;display:flex;flex-wrap:wrap;align-items:stretch}
.steps li{display:flex}
.steps li.gap{display:none}
.steps li.bon{margin-left:auto}
.steps button{color:var(--ice);font-size:16px;font-weight:700;padding:13px clamp(12px,1.5vw,24px);gap:9px;text-transform:none}
.steps button:hover{background:rgba(255,255,255,.12)}
.steps button[aria-current="step"]{background:var(--bar2);color:var(--ice);box-shadow:inset 0 -4px 0 var(--ice)}
.steps .sq{display:none}
.steps .n{background:rgba(255,255,255,.22);color:var(--ice)}
.steps button.bonus{font-size:14px;font-weight:600;padding-left:14px;padding-right:14px}
.steps .bt{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:999px}
.pfoot .next{margin-left:auto}
.pfoot .keys{display:none}

/* set up: Go, and a small way back lower down */
.joingo{min-width:96px;justify-content:center}
.joinback{margin-top:26px;font-size:14px;font-weight:600;opacity:.85}

/* ---------- Connecting drivers ---------- */
.stage[data-mode="draw"] .st-cap,.stage[data-mode="draw"] .st-explore{display:none!important}
.st-drv .dk{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78);line-height:1.2}
.st-own:not(.blank),.st-own.rown{background:var(--own);color:#fff;border:2px dotted rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(0,0,0,.28)}
.st-own:not(.blank)::after{background:var(--own)}
.st-own .who{color:rgba(255,255,255,.85);opacity:1}
/* the white panel of instructions */
.st-guide{position:absolute;z-index:5;background:#FFFFFF;color:#0A0A0A;padding:20px 22px 18px;box-shadow:0 12px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:12px}
.st-guide[hidden],.st-guide.off{display:none}
.stage:not([data-act]) .st-guide,.stage.zooming .st-guide{display:none}
.st-guide .gh{display:flex;gap:14px;align-items:flex-start}
.st-guide .gq{flex:1;margin:0;font-size:clamp(17px,.8rem + .4vw,20px);line-height:1.4;font-weight:600}
.st-guide .ghb{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #0A0A0A;background:#fff;color:#0A0A0A;font-weight:700;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.st-guide .ghb:hover,.st-guide .ghb[aria-expanded="true"]{background:#0A0A0A;color:#fff}
.st-guide .ghelp{font-size:15.5px;line-height:1.5;border-top:1px solid rgba(10,10,10,.15);padding-top:12px}
.st-guide .gown{margin:0;font-size:15.5px;line-height:1.45;color:#444}
.st-enter .st-guide{animation:st-in .7s var(--ease) both;animation-delay:1.8s}
/* the next risk in your group: a big white button */
.st-next{width:auto;height:auto;border-radius:999px;padding:15px 20px 15px 26px;display:flex;align-items:center;gap:12px;background:#FDFCF3;color:#0A0A0A;box-shadow:0 10px 26px rgba(0,0,0,.32);white-space:nowrap}
.st-next .nl{position:static;transform:none;width:auto;font-size:clamp(17px,.8rem + .35vw,20px);font-weight:700;letter-spacing:0;text-transform:none;color:inherit;line-height:1.2}
.stage.narrow .st-next .nl{display:inline}
.stage.narrow .st-next{width:auto;height:auto}
.st-next svg{width:24px;height:24px;flex:none}
.st-next:hover{background:#F0E060;transform:none}
.st-next.off{display:none}
/* the × on a line: bigger */
.st-x{width:38px;height:38px;margin:-19px 0 0 -19px;font-size:24px;border-width:2.5px;opacity:.92}

/* ---------- Review ---------- */
.stage[data-mode="room"] .st-cap{font-family:var(--ff-serif);font-weight:600;font-size:clamp(26px,1rem + 1vw,38px);line-height:1.08;color:#fff;min-height:0}
.st-own.rown .tx{color:#fff}
.st-it .heart{position:absolute;top:6px;right:6px;border:0;background:none;color:#fff;display:flex;align-items:center;gap:5px;font:inherit;font-weight:700;font-size:15px;letter-spacing:0;text-transform:none;padding:4px 6px;cursor:pointer;z-index:2}
.st-card .heart{border:0;background:none;color:inherit;display:flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:17px;padding:4px 0;cursor:pointer}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.heart.on svg{fill:currentColor}
.heart:hover svg{transform:scale(1.12)}
.heart.mine{cursor:default;opacity:.8}
.heart.mine:hover svg{transform:none}
.st-own.rown .who{padding-right:46px}
.rnum{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:2px solid #1C3150;background:#E0C060;color:#0A0A0A;
  display:grid;place-items:center;padding:0;font:inherit;font-weight:700;font-size:15px;line-height:1;pointer-events:auto;cursor:pointer;z-index:2;transition:transform .15s var(--ease)}
.rnum.wide{width:36px;height:36px}
.rnum:hover,.rnum.on{transform:translate(-50%,-50%) scale(1.15);background:#FDFCF3;z-index:3}
.rnum .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#FDFCF3;color:#0A0A0A;font-size:14px;font-weight:600;padding:7px 11px;
  box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .15s}
.rnum:hover .tip,.rnum:focus-visible .tip{opacity:1}
.stage.narrow .rnum .tip{display:none}
.st-legend .rkey{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#E0C060;color:#0A0A0A;font-weight:700;font-size:12.5px}
/* the white panel beside Review */
.st-raside{background:#FFFFFF;color:#0A0A0A;padding:22px 24px 20px;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.st-raside .gk{font-family:var(--ff-serif);font-weight:600;font-size:clamp(24px,1rem + .6vw,30px);line-height:1.1;margin:0}
.st-raside .gs{margin:0;font-size:17px;line-height:1.5}
.st-raside .gn{margin:0;font-size:15px;line-height:1.45;color:#555}
.st-raside .glink{align-self:flex-start;border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;font-size:15.5px;line-height:1.4;color:#0A0A0A;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.st-raside .glink:hover{color:var(--crimson)}
.pfoot button{-webkit-user-select:none;user-select:none}
@media (max-width:560px){.pfoot .demo span{display:none}.pfoot .demo{padding:5px}}
.stage.narrow[data-mode="room"] .st-cap{font-size:25px;line-height:1.1}
.stage.narrow .rnum{border-color:#7A0E2C}
.stage.narrow[data-mode="room"] .st-drv,.stage.narrow[data-mode="room"] .st-own{padding-right:58px}
.stage.wide[data-mode="draw"] .st-legend{flex-direction:column;align-items:flex-start;gap:8px}

/* the example room: a note in the footer, with the way out */
.pfoot{align-items:center}
.pfoot .demowrap{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.pfoot .demowrap[hidden]{display:none}
.pfoot .demo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#E08850;color:#0A0A0A;padding:7px 7px 7px 16px;font-size:15px;font-weight:600;line-height:1.3;max-width:100%}
.pfoot .demo button{background:#0A0A0A;color:#fff;font-size:14px;padding:8px 12px}

/* ================= October 22: a chosen driver opens up ================= */
.st-drv .dx{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);color:#FFFFFF;padding:2px 16px 10px;text-transform:none;letter-spacing:0;
  font-weight:500;cursor:default;box-shadow:0 18px 30px rgba(0,0,0,.4);text-align:left}
.stage[data-mode="draw"] .st-drv.xp1 .dx,.stage[data-mode="draw"] .st-drv.xp2 .dx{display:block}
.stage[data-mode="draw"] .st-drv.xp1,.stage[data-mode="draw"] .st-drv.xp2{z-index:9;transform:none;outline:0;box-shadow:0 0 0 4px #F0E060}
.stage[data-mode="draw"] .st-drv.xp1 .dx,.stage[data-mode="draw"] .st-drv.xp2 .dx{box-shadow:0 0 0 4px #F0E060,0 18px 30px rgba(0,0,0,.4);clip-path:inset(0 -8px -40px -8px)}
.st-drv.xp1::after,.st-drv.xp2::after{display:none}
.st-drv .dtl{margin:0 0 6px;padding-top:8px;border-top:1.5px solid rgba(255,255,255,.35);font-size:clamp(15px,.8rem + .2vw,17px);line-height:1.4;font-weight:600}
.st-drv .dfull{display:none}
.st-drv.xp2 .dfull{display:block}
.st-drv.xp2 .dtl{font-size:clamp(17px,.85rem + .35vw,20px)}
.dfull p{margin:0 0 .7em;font-size:clamp(15px,.8rem + .2vw,17px);line-height:1.5;font-weight:500}
.dfull .dexk{display:block;margin:4px 0 4px;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.85}
.dfull .dex{margin:0 0 .4em;padding-left:18px;font-size:clamp(14px,.78rem + .15vw,16px);line-height:1.45}
.dfull .dex li{margin-bottom:.35em}

 'drvx.D1':'In February 2024, the payments company Klarna said its AI assistant was doing the equivalent work of 700 full-time customer service agents, but by May 2025 its CEO said the approach had led to lower quality, and the company began rehiring human agents.\nAfter ChatGPT launched, Google’s management declared a ‘code red’ and reassigned teams, including from its Trust and Safety division, to speed up AI product releases.',
 'drvt.D2':'When money and power come from people’s time, data and beliefs, AI gets used to keep us hooked and change our minds cheaply.',
 'drvf.D2':'When income grows with time spent and data collected, products are designed to be hard to step away from. AI companions can go further than social media, because they can feel like a relationship and learn a great deal about the user.\n\nCampaigns, pressure groups, states and companies all want to shape opinion. AI makes persuasive content cheaper, and makes it look like it comes from many different people. Cheaper influence is not always more effective, though.',
 'drvx.D2':'Two days before the January 2024 New Hampshire primary, voters received robocalls using an AI clone of President Biden’s voice telling them not to vote, and the political consultant who admitted commissioning the calls was fined $6 million by the US regulator, the FCC.\nCompanion apps can take up children’s time with parents, teachers and friends, while building long-term profiles of their behaviour that are valuable for targeted advertising.',
 'drvt.D3':'Skill and effort used to stop many harmful or careless attempts, but AI has lowered both barriers, so far more people can try.',
 'drvf.D3':'Expertise used to stop many people from attempting harmful things, such as fake images or hacking tools. Now it stops fewer. This is about who can try, not whether they succeed: for the most dangerous uses, the evidence is mixed.\n\nEffort also used to sort things. Job applications, public consultations, complaints and story submissions assumed that taking time to write showed real interest. Cheap AI writing removes that signal, even when the people sending it are real.',
 'drvx.D3':'Anthropic reported in August 2025 that a criminal with only basic coding ability used its model to build and sell ransomware.\nUK graduate employers received an average of 140 applications per vacancy in 2023/24, the highest since records began in 1991, and the Institute of Student Employers named AI-assisted applications as one cause, alongside fewer vacancies.',
 'drvt.D4':'A small number of firms control the computing power, data and models others rely on, which gives them influence over what others can do.',
 'drvf.D4':'A small number of firms control the computing power, data and AI models that people and institutions increasingly depend on. That gives them influence over what others can do, sometimes including governments and armed forces.\n\nWhen so much rests on so few, a single company’s decision or mistake can ripple out to everyone who depends on it.',
 'drvx.D4':'In 2022, Ukraine asked SpaceX to extend Starlink satellite coverage to Crimea for a drone attack on the Russian fleet, and Musk declined, showing that a private owner held an effective veto over a military operation.\nIn July 2024, a faulty update from one security company, CrowdStrike, crashed about 8.5 million Windows devices, grounding flights and disrupting banks and hospitals; this was not AI, but it shows how dependence on a single supplier turns one error into a global failure.',
 'drvt.D5':'A person formally signs off, but they go along with the system, can’t keep up with it, or have no real power to overrule it.',
 'drvf.D5':'Automated systems can act at speeds where human review becomes a formality, or never happens at all. The race to be first pushes towards more speed, and more speed makes human checks harder to keep.\n\nEven when there is time, a person may sign off without really checking, or have no power to say no. Judgement can be handed over willingly or taken away. And people who stop using a skill can lose it.',
 'drvx.D5':'Australia’s Robodebt scheme (2015 to 2019) automatically raised welfare debts using averaged income data and put the burden on recipients to prove them wrong, and a Royal Commission found in 2023 that it was neither fair nor legal.\nIn the May 2010 ‘flash crash’, automated trading helped send the Dow Jones down nearly 1,000 points, with 600 points lost in about five minutes, before it largely recovered.',
 'drvt.D6':'Checking an AI system takes time, money and skill, and the company being checked often decides who tests it and for how long.',
 'drvf.D6':'AI systems can be checked, but doing it well takes time, money, specialist skill and the cooperation of the company being checked. Independent checking costs far more than building or launching the system.\n\nThe company often decides who tests its models, for how long and with what information. Testers can fear losing access or legal action. That raises a further question: who checks the checkers?',
 'drvx.D6':'In March 2024, more than 350 researchers signed an open letter asking AI companies to protect good-faith independent testing, after their research found that none of seven major developers offered comprehensive protections.\nThe independent tester METR reported in 2025 that it got access to OpenAI’s o3 model three weeks before release, tested it in a relatively short time, and had limited information to interpret its results.',
 'drvt.D7':'Laws often lag behind AI and stop at borders, blame gets passed around, and people struggle to challenge automated decisions.',
 'drvf.D7':'Laws often move more slowly than technology, and many were designed for slower processes, physical goods or human decision-makers. An AI service can be offered worldwide from one country, while regulators can mostly act only within their own.\n\nWhen AI is involved, the developer, the organisation using it and the human operator can each blame another, or ‘the system’. Sometimes the law hasn’t settled who answers for what. And people on the receiving end often have no clear way to challenge a decision.',
 'drvx.D7':'In Moffatt v. Air Canada (2024), the airline argued that its chatbot, which had given a customer wrong information about bereavement fares, was a separate legal entity responsible for its own actions; the tribunal called this a ‘remarkable submission’ and held the airline liable.\nData regulators in the Netherlands, France, Italy, Greece and the UK have fined the US facial recognition company Clearview AI, but regulators have struggled to collect the EU fines, and the company says it is not subject to EU law because it has no place of business there.',
